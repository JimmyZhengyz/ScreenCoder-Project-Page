<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ScreenCoder demo preview</title>
  <desc id="desc">A stylized browser window showing an uploaded UI screenshot, a structured layout preview, and generated code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#20294c"/>
      <stop offset="1" stop-color="#4f5fb0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ffcf59"/>
      <stop offset="1" stop-color="#ff8f70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#7180d0" opacity=".22"/>
  <circle cx="120" cy="690" r="250" fill="#17203e" opacity=".35"/>
