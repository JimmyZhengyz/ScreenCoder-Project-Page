<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">ScreenCoder method pipeline</title>
  <desc id="desc">A UI screenshot passes through grounding, planning, generation, and placeholder mapping to produce executable HTML and CSS.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#27376d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#7985ad"/>
    </marker>
  </defs>
  <rect width="1440" height="420" rx="34" fill="url(#canvas)"/>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(54 82)" filter="url(#shadow)">
      <rect width="214" height="256" rx="24" fill="#fff" stroke="#dfe4f4"/>
      <rect x="22" y="28" width="170" height="114" rx="12" fill="#f5f6fb" stroke="#d6dbea"/>
      <rect x="38" y="44" width="138" height="12" rx="6" fill="#b9c0d8"/>
      <rect x="38" y="70" width="48" height="54" rx="8" fill="#d8dcf0"/>
      <rect x="96" y="70" width="80" height="22" rx="7" fill="#c8cee5"/>
      <rect x="96" y="102" width="80" height="22" rx="7" fill="#e0e3f1"/>
      <text x="107" y="184" text-anchor="middle" fill="#171d35" font-size="20" font-weight="700">Input UI</text>
      <text x="107" y="214" text-anchor="middle" fill="#68718f" font-size="14">Screenshot or sketch</text>
    </g>

    <path d="M287 210h58" fill="none" stroke="#7985ad" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(366 82)" filter="url(#shadow)">
      <rect width="214" height="256" rx="24" fill="#fff" stroke="#dfe4f4"/>
      <circle cx="107" cy="83" r="40" fill="#fff2c9"/>
      <path d="M82 70h50M82 84h32M82 98h42" stroke="#e9ad18" stroke-width="8" stroke-linecap="round"/>
      <text x="107" y="174" text-anchor="middle" fill="#171d35" font-size="20" font-weight="700">Grounding</text>
      <text x="107" y="204" text-anchor="middle" fill="#68718f" font-size="14">Locate and label regions</text>
      <rect x="63" y="222" width="88" height="4" rx="2" fill="#f1b820"/>
    </g>

    <path d="M599 210h58" fill="none" stroke="#7985ad" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(678 82)" filter="url(#shadow)">
      <rect width="214" height="256" rx="24" fill="#fff" stroke="#dfe4f4"/>
      <circle cx="107" cy="83" r="40" fill="#e6efff"/>
      <path d="M107 58v18M78 105V87h58v18M78 105h1M107 105h1M136 105h1" fill="none" stroke="#5078ce" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="107" y="174" text-anchor="middle" fill="#171d35" font-size="20" font-weight="700">Planning</text>
      <text x="107" y="204" text-anchor="middle" fill="#68718f" font-size="14">Build a layout tree</text>
      <rect x="63" y="222" width="88" height="4" rx="2" fill="#5f87dc"/>
    </g>

    <path d="M911 210h58" fill="none" stroke="#7985ad" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(990 82)" filter="url(#shadow)">
      <rect width="214" height="256" rx="24" fill="#fff" stroke="#dfe4f4"/>
      <circle cx="107" cy="83" r="40" fill="#e7f5df"/>
      <path d="M88 67l-15 16 15 16M126 67l15 16-15 16M115 59l-16 48" fill="none" stroke="#5e9b3e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="107" y="174" text-anchor="middle" fill="#171d35" font-size="20" font-weight="700">Generation</text>
      <text x="107" y="204" text-anchor="middle" fill="#68718f" font-size="14">Synthesize HTML/CSS</text>
      <rect x="63" y="222" width="88" height="4" rx="2" fill="#69a84a"/>
    </g>

    <path d="M1223 210h40" fill="none" stroke="#7985ad" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(1284 111)">
      <rect width="102" height="198" rx="20" fill="#1d2440"/>
      <circle cx="26" cy="24" r="5" fill="#f19a8a"/>
      <circle cx="44" cy="24" r="5" fill="#f2c168"/>
      <circle cx="62" cy="24" r="5" fill="#8fd5a4"/>
      <path d="M21 62h60M21 82h43M21 102h54M21 122h34M21 142h60" stroke="#b9c6ff" stroke-width="7" stroke-linecap="round"/>
      <text x="51" y="230" text-anchor="middle" fill="#171d35" font-size="17" font-weight="700">Output</text>
    </g>
  </g>
</svg>
